<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benchmark audit</title>
<style>
body{margin:0;background:#101318;color:#edf1f7;font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#181d25;padding:12px 18px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 10px #0008}button,.file{background:#2c78d4;color:white;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}.file input{display:none}main{max-width:1100px;margin:auto;padding:18px}.muted{color:#a9b3c3}.card{background:#1a202a;border:1px solid #303948;border-radius:10px;padding:18px}video{width:100%;max-height:520px;background:#000;border-radius:8px}.turn{margin:10px 0;padding:10px 12px;background:#242c38;border-left:4px solid #5a9be9;border-radius:4px}.axis{color:#82b9ff;text-transform:uppercase;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}.field{background:#222a35;padding:10px;border-radius:6px}.field label{display:block;margin-bottom:6px}.field select,.field textarea{width:100%;box-sizing:border-box;background:#10151c;color:#fff;border:1px solid #465267;border-radius:4px;padding:7px}.field.notes{grid-column:1/-1}footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.count{min-width:90px;text-align:center}
</style></head><body><header><strong id="title"></strong><span class="muted" id="progress"></span><button id="exportJson">Export JSON</button><button id="exportCsv">Export CSV</button><label class="file">Import JSON<input id="importJson" type="file" accept="application/json"></label></header><main><section class="card"><h2 id="heading"></h2><div class="muted" id="meta"></div><p id="caption"></p><video id="video" controls preload="metadata"></video><div id="turns"></div><div class="grid" id="form"></div><footer><button id="prev">← Previous</button><span class="count" id="position"></span><button id="next">Next →</button></footer></section></main>
<script>
const DATA=__REVIEW_DATA__;const KEY=DATA.version+':review';let state=JSON.parse(localStorage.getItem(KEY)||'null')||Object.fromEntries(DATA.defaults.map(x=>[x.review_id,x]));let index=0;
const labels={person_relevance:'Person relevance',instruction_feasibility:'Instruction feasibility',chain_coherence:'Chain coherence',task_diversity:'Task diversity',technical_quality:'Technical quality'};
function save(){localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('progress').textContent=`${Object.keys(state).length} records saved locally`}
function render(){const c=DATA.cards[index],r=state[c.chain_id]||DATA.defaults[index];document.getElementById('title').textContent=DATA.title;document.getElementById('heading').textContent=`${c.chain_id} · ${c.chain_type}`;document.getElementById('meta').textContent=c.source_dataset+' · '+c.scene.scene_tag;document.getElementById('caption').textContent='Source caption: '+c.source_caption;const v=document.getElementById('video');v.src=c.video;v.load();document.getElementById('turns').innerHTML=c.turns.map(t=>`<div class="turn"><div class="axis">Round ${t.round} · ${t.axis}${t.history_reference_round===null?'':` · restore R${t.history_reference_round}`}</div>${esc(t.instruction)}</div>`).join('');let html=DATA.fields.map(f=>`<div class="field"><label>${labels[f]}</label><select data-f="${f}"><option value="1">1 · Pass</option><option value="0">0 · Fail</option><option value="2">2 · Unsure</option></select></div>`).join('');html+=`<div class="field notes"><label>Notes</label><textarea rows="3" data-f="notes"></textarea></div>`;const form=document.getElementById('form');form.innerHTML=html;form.querySelectorAll('[data-f]').forEach(e=>{e.value=r[e.dataset.f]??'';e.onchange=()=>{state[c.chain_id]={...r,[e.dataset.f]:e.value};save()}});document.getElementById('position').textContent=`${index+1} / ${DATA.cards.length}`;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===DATA.cards.length-1;save()}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.getElementById('prev').onclick=()=>{if(index){index--;render()}};document.getElementById('next').onclick=()=>{if(index<DATA.cards.length-1){index++;render()}};
document.getElementById('exportJson').onclick=()=>download('benchmark_review.json',JSON.stringify({version:DATA.version,reviews:Object.values(state)},null,2),'application/json');document.getElementById('exportCsv').onclick=()=>{const h=['review_id','chain_id',...DATA.fields,'notes'];const q=x=>'"'+String(x??'').replaceAll('"','""')+'"';download('benchmark_review.csv',[h,...Object.values(state).map(r=>h.map(k=>r[k]))].map(r=>r.map(q).join(',')).join('\n'),'text/csv')};document.getElementById('importJson').onchange=async e=>{const x=JSON.parse(await e.target.files[0].text());for(const r of x.reviews||[])if(state[r.review_id])state[r.review_id]=r;save();render()};render();
</script></body></html>
