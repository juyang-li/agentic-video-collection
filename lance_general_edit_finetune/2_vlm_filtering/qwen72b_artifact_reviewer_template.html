<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qwen72B 高风险伪影对照审核</title>
  <style>
    :root { color-scheme:dark; --bg:#101217; --panel:#1a1e26; --line:#343b49; --muted:#a4adba; --good:#3bae72; --bad:#e05a64; --warn:#d3a33b; --blue:#72aaff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:#eef2f8; font:15px/1.48 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; background:#141820f2; border-bottom:1px solid var(--line); }
    header strong { white-space:nowrap; } progress { width:210px; height:12px; }
    button,textarea { font:inherit; } button { color:#eef2f8; background:#292f3a; border:1px solid #46505f; border-radius:7px; padding:7px 11px; cursor:pointer; }
    button.active { outline:2px solid var(--blue); } button.good.active { outline-color:var(--good); background:#1e4d37; } button.bad.active { outline-color:var(--bad); background:#57272e; } button.warn.active { outline-color:var(--warn); background:#57431f; }
    button.primary { background:#285fa9; border-color:#4c83d2; } main { max-width:1500px; margin:auto; padding:16px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
    .instruction { padding:12px 14px; background:#12151b; border-radius:7px; white-space:pre-wrap; font-size:17px; }
    .label,.muted { color:var(--muted); } .label { font-size:13px; margin-right:8px; }
    .model-head { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; }
    .badge { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:3px 9px; font-weight:650; }
    .badge.pass,.badge.accepted { color:#b9f5d1; border-color:#317a51; background:#173825; }
    .badge.fail,.badge.rejected { color:#ffc4c8; border-color:#9b4048; background:#442127; }
    .badge.uncertain { color:#ffe0a0; border-color:#8d6c2d; background:#3e321b; }
    .evidence-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .evidence { background:#12161d; border:1px solid #2d3440; border-radius:7px; padding:9px; min-width:0; }
    .evidence strong { display:block; margin-bottom:4px; }
    .video-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .video-card { min-width:0; }
    .video-label { color:var(--muted); margin-bottom:5px; font-weight:650; letter-spacing:.04em; }
    video { width:100%; max-height:59vh; background:#000; border-radius:8px; }
    .status-row { display:flex; gap:8px; margin:14px 0 8px; flex-wrap:wrap; align-items:center; }
    textarea { width:100%; min-height:74px; color:#eef2f8; background:#11151c; border:1px solid var(--line); border-radius:7px; padding:8px; }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:16px 0 40px; }
    .io { display:flex; gap:7px; flex-wrap:wrap; margin-left:auto; } .timer { font-variant-numeric:tabular-nums; }
    @media(max-width:950px){.video-grid,.evidence-grid{grid-template-columns:1fr}progress{width:120px}.io{margin-left:0}}
  </style>
</head>
<body>
<header>
  <strong>72B 伪影筛查对照</strong><progress id="progress" value="0" max="1"></progress><span id="progressText"></span><span class="timer" id="timer">00:00</span>
  <button id="jumpBtn">跳转</button><div class="io"><button id="exportCsv">导出 CSV</button><button id="exportJson">备份 JSON</button><button id="importBtn">导入</button><input id="importFile" type="file" accept=".csv,.json" hidden></div>
</header>
<main>
  <section class="panel"><div class="instruction"><span class="label">INSTRUCTION</span><span id="instruction"></span></div></section>
  <section class="panel">
    <div class="model-head"><strong>Qwen2.5-VL-72B</strong><span id="modelDecision" class="badge"></span><span id="modelChecks"></span><span id="riskInfo" class="muted"></span></div>
    <div class="muted" id="reasonCodes"></div>
    <div class="evidence-grid">
      <div class="evidence"><strong>指令执行</strong><div id="instructionEvidence"></div></div>
      <div class="evidence"><strong>伪影/残留/遮罩</strong><div id="artifactEvidence"></div></div>
      <div class="evidence"><strong>内容保持</strong><div id="preservationEvidence"></div></div>
    </div>
  </section>
  <section class="panel">
    <div class="video-grid">
      <div class="video-card"><div class="video-label" id="sourceLabel">SRC</div><video id="sourceVideo" controls muted loop playsinline></video></div>
      <div class="video-card"><div class="video-label" id="targetLabel">TARGET</div><video id="targetVideo" controls muted loop playsinline></video></div>
    </div>
    <div class="status-row"><strong>你的结论</strong><button class="status good" data-status="usable">1 可用</button><button class="status bad" data-status="unusable">0 不可用</button><button class="status warn" data-status="uncertain">2 存疑</button><span class="muted">空格同步播放</span></div>
    <textarea id="notes" placeholder="可选备注：例如残影、矩形遮罩、纹理断裂、72B 漏报/误报"></textarea>
  </section>
  <div class="footer"><button id="previous">← 上一条</button><span id="saveState" class="muted">已自动保存</span><button id="next" class="primary">完成本条并继续 →</button></div>
</main>
<script id="surveyData" type="application/json">__SURVEY_DATA__</script>
<script>
(()=>{
  "use strict";
  const survey=JSON.parse(document.getElementById("surveyData").textContent),items=survey.items,$=id=>document.getElementById(id),storageKey=`qwen72b-artifact-review:${survey.survey_version}`;
  const sourceVideo=$("sourceVideo"),targetVideo=$("targetVideo"); let syncLock=false,state=loadState(),index=Math.min(Number(state.index||0),Math.max(0,items.length-1)),enteredAt=Date.now();
  function fresh(){return{version:survey.survey_version,index:0,reviews:{}}} function empty(){return{status:"",notes:"",seconds:0,updated_at:""}}
  function loadState(){try{const x=JSON.parse(localStorage.getItem(storageKey)||"null");return x&&x.version===survey.survey_version?x:fresh()}catch(_){return fresh()}}
  function review(){const id=items[index].sample_id;if(!state.reviews[id])state.reviews[id]=empty();return state.reviews[id]}
  function save(){state.index=index;localStorage.setItem(storageKey,JSON.stringify(state));$("saveState").textContent="已自动保存 "+new Date().toLocaleTimeString();updateProgress()}
  function account(){review().seconds=Number(review().seconds||0)+Math.max(0,Math.round((Date.now()-enteredAt)/1000));enteredAt=Date.now()}
  function collect(){review().notes=$("notes").value;review().updated_at=new Date().toISOString()}
  function badge(value){return `<span class="badge ${value}">${value}</span>`}
  function render(){const item=items[index],r=review();enteredAt=Date.now();$("instruction").textContent=item.instruction;sourceVideo.src=item.source_media;targetVideo.src=item.target_media;
    $("sourceLabel").textContent="SRC"+(item.generated_role==="source"?" · GENERATED":"");$("targetLabel").textContent="TARGET"+(item.generated_role==="target"?" · GENERATED":"");
    $("modelDecision").className=`badge ${item.qwen72b_decision}`;$("modelDecision").textContent=item.qwen72b_decision;$("modelChecks").innerHTML=`instruction ${badge(item.qwen72b_instruction_following)} artifact ${badge(item.qwen72b_visible_artifact)} preservation ${badge(item.qwen72b_content_preservation)}`;
    $("riskInfo").textContent=`生成侧 ${item.generated_role.toUpperCase()} · ${item.risk_group} · risk ${item.artifact_risk_score}`;$("reasonCodes").textContent="reason codes: "+(item.qwen72b_reason_codes||"无");
    $("instructionEvidence").textContent=item.qwen72b_instruction_evidence;$("artifactEvidence").textContent=item.qwen72b_artifact_evidence;$("preservationEvidence").textContent=item.qwen72b_preservation_evidence;
    document.querySelectorAll(".status").forEach(b=>b.classList.toggle("active",b.dataset.status===r.status));$("notes").value=r.notes||"";$("next").textContent=index===items.length-1?"保存最后一条":"完成本条并继续 →";updateProgress()}
  function setStatus(status){account();review().status=status;collect();save();render()} function move(delta){collect();account();if(delta>0&&!review().status){alert("请先选择你的结论");return}index=Math.max(0,Math.min(items.length-1,index+delta));save();render()}
  function updateProgress(){const done=items.filter(x=>state.reviews[x.sample_id]?.status).length;$("progress").max=items.length;$("progress").value=done;$("progressText").textContent=`${done}/${items.length} 完成 · 当前 ${index+1}/${items.length}`;const sec=Object.values(state.reviews).reduce((s,r)=>s+Number(r.seconds||0),0);$("timer").textContent=new Date(sec*1000).toISOString().slice(11,19)}
  function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function csvCell(v){const t=String(v??"");return /[",\n]/.test(t)?`"${t.replaceAll('"','""')}"`:t} const fields=["survey_version","sample_id","dataset","branch","operation","instruction","qwen72b_decision","qwen72b_instruction_following","qwen72b_visible_artifact","qwen72b_content_preservation","overall_status","notes","seconds","updated_at"];
  function rows(){return items.map(item=>{const r=state.reviews[item.sample_id]||empty();return{...Object.fromEntries(fields.map(f=>[f,item[f]||""])),overall_status:r.status,notes:r.notes,seconds:r.seconds,updated_at:r.updated_at}})}
  function exportCsv(){download(`${survey.survey_version}_review.csv`,[fields.join(","),...rows().map(r=>fields.map(f=>csvCell(r[f])).join(","))].join("\n")+"\n","text/csv;charset=utf-8")}
  function parseCsv(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=""}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=""}else if(c!=='\r')cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const h=rows.shift()||[];return rows.filter(r=>r.length).map(r=>Object.fromEntries(h.map((x,i)=>[x,r[i]||""])))}
  function importRows(rows){const known=new Set(items.map(x=>x.sample_id));let n=0;for(const r of rows){if(!known.has(r.sample_id)||!r.overall_status)continue;state.reviews[r.sample_id]={status:r.overall_status,notes:r.notes||"",seconds:Number(r.seconds||0),updated_at:r.updated_at||""};n++}save();render();return n}
  document.querySelectorAll(".status").forEach(b=>b.addEventListener("click",()=>setStatus(b.dataset.status)));$("notes").addEventListener("input",()=>{collect();save()});$("next").onclick=()=>move(1);$("previous").onclick=()=>move(-1);$("jumpBtn").onclick=()=>{const n=Number(prompt(`跳转到 1-${items.length}`,String(index+1)));if(Number.isInteger(n)&&n>=1&&n<=items.length){collect();account();index=n-1;save();render()}};
  $("exportCsv").onclick=exportCsv;$("exportJson").onclick=()=>download(`${survey.survey_version}_backup.json`,JSON.stringify(state,null,2),"application/json");$("importBtn").onclick=()=>$("importFile").click();$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const t=await f.text(),n=f.name.toLowerCase().endsWith(".json")?importRows(Object.entries(JSON.parse(t).reviews||{}).map(([sample_id,r])=>({sample_id,overall_status:r.status,notes:r.notes,seconds:r.seconds,updated_at:r.updated_at}))):importRows(parseCsv(t));alert(`已导入 ${n} 条`)}catch(err){alert("导入失败："+(err?.message||err))}finally{e.target.value=""}};
  function sync(a,b,action){if(syncLock)return;syncLock=true;if(action==="play")b.play().catch(()=>{});if(action==="pause")b.pause();if(action==="seek"&&Math.abs(a.currentTime-b.currentTime)>.08)b.currentTime=a.currentTime;setTimeout(()=>syncLock=false,0)}
  [sourceVideo,targetVideo].forEach(v=>{const o=v===sourceVideo?targetVideo:sourceVideo;v.addEventListener("play",()=>sync(v,o,"play"));v.addEventListener("pause",()=>sync(v,o,"pause"));v.addEventListener("seeking",()=>sync(v,o,"seek"))});
  document.addEventListener("keydown",e=>{if(e.target.matches("textarea,input"))return;if(e.key==="1")setStatus("usable");else if(e.key==="0")setStatus("unusable");else if(e.key==="2")setStatus("uncertain");else if(e.key===" "){e.preventDefault();if(sourceVideo.paused&&targetVideo.paused)sourceVideo.play().catch(()=>{});else{sourceVideo.pause();targetVideo.pause()}}else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1)});
  setInterval(updateProgress,1000);window.addEventListener("beforeunload",()=>{collect();account();save()});render();
})();
</script>
</body>
</html>
