<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen72B 版本对照复核</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1f2937;background:#eef2f7}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:14px}.panel{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px #0001}.top,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.muted{color:#64748b;font-size:13px}.badge{padding:3px 9px;border-radius:999px;background:#e2e8f0;font-weight:650;font-size:13px}.accepted,.pass,.usable,.correct_accept,.caught_unusable{background:#dcfce7;color:#166534}.rejected,.fail,.unusable,.missed_unusable,.false_reject{background:#fee2e2;color:#991b1b}.uncertain,.human_uncertain{background:#fef3c7;color:#92400e}.instruction{font-size:18px;font-weight:650;line-height:1.45}.shift{font-size:25px;font-weight:800;margin:10px 0;padding:12px;border:2px solid #cbd5e1;border-radius:10px;background:#f8fafc}.shift .arrow{padding:0 12px;color:#475569}.videos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.video-box{position:relative;background:#111;border-radius:10px;overflow:hidden}.video-label{position:absolute;z-index:2;left:8px;top:8px;background:#000b;color:white;padding:4px 8px;border-radius:6px;font-size:13px}.video-box video{display:block;width:100%;height:min(46vh,520px);object-fit:contain}.models{display:grid;grid-template-columns:1fr 1fr;gap:10px}.model{border:1px solid #dbe2ea;border-radius:10px;padding:11px}.model h3{margin:0 0 8px}.checks{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.evidence{font-size:13px;line-height:1.45;white-space:pre-wrap;border-top:1px solid #e5e7eb;padding-top:7px}.human{border-left:5px solid #64748b}.actions button,.nav button{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:650}.actions button{background:#e2e8f0}.actions button.active{outline:3px solid #2563eb}.nav button{background:#2563eb;color:white}.nav button.secondary{background:#475569}textarea{width:100%;min-height:54px;box-sizing:border-box;margin-top:8px;padding:8px}.route{font-family:ui-monospace,monospace;font-size:13px;background:#f8fafc;padding:8px;border-radius:7px}@media(max-width:850px){.videos,.models{grid-template-columns:1fr}.video-box video{height:36vh}.shift{font-size:19px}}
</style>
</head>
<body><div class="wrap">
<div class="panel top"><div><strong id="progress"></strong> <span id="capture" class="badge"></span></div><div class="nav"><button class="secondary" id="prev">← 上一条</button><button id="next">下一条 →</button><button class="secondary" id="export">导出本次复核</button></div></div>
<div class="panel"><div class="row"><span id="dataset" class="badge"></span><span id="humanStatus" class="badge"></span><span id="changed" class="badge"></span></div><div id="decisionShift" class="shift"></div><div id="instruction" class="instruction"></div><div id="route" class="route"></div></div>
<div class="panel videos"><div class="video-box"><span id="sourceLabel" class="video-label"></span><video id="sourceVideo" controls loop muted preload="metadata"></video></div><div class="video-box"><span id="targetLabel" class="video-label"></span><video id="targetVideo" controls loop muted preload="metadata"></video></div></div>
<div class="panel models"><div class="model"><h3><span id="oldModelLabel">旧 72B</span> <span id="old72bDecision" class="badge"></span></h3><div id="old72bChecks" class="checks"></div><div id="old72bEvidence" class="evidence"></div></div><div class="model"><h3><span id="newModelLabel">新 72B</span> <span id="new72bDecision" class="badge"></span></h3><div id="new72bChecks" class="checks"></div><div id="new72bEvidence" class="evidence"></div></div></div>
<div class="panel human"><strong>上一轮人工结论与备注</strong><div id="humanNotes" class="evidence"></div></div>
<div class="panel"><div class="actions row"><strong>本次确认右侧新版判断：</strong><button data-verdict="correct">判断正确</button><button data-verdict="wrong">判断错误</button><button data-verdict="uncertain">仍存疑</button></div><textarea id="reviewNotes" placeholder="可选：记录它抓住或漏掉了什么"></textarea><div id="saved" class="muted"></div></div>
</div>
<script id="surveyData" type="application/json">__SURVEY_DATA__</script>
<script>
const survey=JSON.parse(document.getElementById("surveyData").textContent),items=survey.items,$=id=>document.getElementById(id);let index=0,entered=Date.now();const key=`qwen72b-audit-v3:${survey.survey_version}`;let state;try{state=JSON.parse(localStorage.getItem(key)||"null")||{}}catch(_){state={}}state.reviews=state.reviews||{};index=Math.min(Number(state.index||0),items.length-1);
function badge(value){return `<span class="badge ${value}">${value||"-"}</span>`}function review(){const id=items[index].sample_id;return state.reviews[id]||(state.reviews[id]={verdict:"",notes:"",seconds:0,updated_at:""})}function account(){const r=review();r.seconds+=Math.max(0,Math.round((Date.now()-entered)/1000));entered=Date.now()}function save(){state.index=index;localStorage.setItem(key,JSON.stringify(state));$("saved").textContent="已自动保存 "+new Date().toLocaleTimeString()}
function model(prefix){const item=items[index],decision=item[`${prefix}_decision`];$(`${prefix}Decision`).textContent=decision;$(`${prefix}Decision`).className=`badge ${decision}`;$(`${prefix}Checks`).innerHTML=`instruction ${badge(item[`${prefix}_instruction_following`])} artifact ${badge(item[`${prefix}_visible_artifact`])} preservation ${badge(item[`${prefix}_content_preservation`])}`;$(`${prefix}Evidence`).textContent=`instruction: ${item[`${prefix}_instruction_following_evidence`]||"-"}\nartifact: ${item[`${prefix}_visible_artifact_evidence`]||"-"}\npreservation: ${item[`${prefix}_content_preservation_evidence`]||"-"}\nreason: ${item[`${prefix}_reason_codes`]||"-"}`}
function render(){const item=items[index],r=review();entered=Date.now();const oldLabel=item.old_model_label||"旧 72B",newLabel=item.new_model_label||"新 72B",captureText={missed_unusable:"漏放：人工不可用但新版接受",caught_unusable:"抓到：人工不可用且新版拒绝",correct_accept:"正确接受：人工可用且新版接受",false_reject:"误杀：人工可用但新版拒绝",human_uncertain:"人工仍存疑"};$("progress").textContent=`${index+1} / ${items.length} · ${item.sample_id}`;$("capture").textContent=captureText[item.capture_status]||item.capture_status;$("capture").className=`badge ${item.capture_status}`;$("dataset").textContent=`${item.dataset} / ${item.operation}`;$("humanStatus").textContent=`人工：${item.human_status}`;$("humanStatus").className=`badge ${item.human_status}`;$("changed").textContent=item.decision_changed==="1"?"两版结论变化":"两版结论一致";$("oldModelLabel").textContent=oldLabel;$("newModelLabel").textContent=newLabel;$("decisionShift").innerHTML=`${oldLabel}：${badge(item.old72b_decision)}<span class="arrow">→</span>${newLabel}：${badge(item.new72b_decision)}<span class="arrow">|</span>人工：${badge(item.human_status)}`;$("instruction").textContent=item.instruction;$("route").textContent=`provenance: ${item.source_provenance} → ${item.target_provenance} | audit: ${item.audit_relation} / ${item.audit_operation} | left=TRAIN_${item.audit_left_training_role.toUpperCase()} | right=TRAIN_${item.audit_right_training_role.toUpperCase()}`;const sourceGenerated=["source","both"].includes(item.generated_role),targetGenerated=["target","both"].includes(item.generated_role);$("sourceLabel").textContent="TRAIN SOURCE · "+(sourceGenerated?"GENERATED":"REFERENCE");$("targetLabel").textContent="TRAIN TARGET · "+(targetGenerated?"GENERATED":"REFERENCE");$("sourceVideo").src=item.source_media;$("targetVideo").src=item.target_media;model("old72b");model("new72b");$("humanNotes").textContent=item.human_notes||"（无备注）";document.querySelectorAll("[data-verdict]").forEach(b=>b.classList.toggle("active",b.dataset.verdict===r.verdict));$("reviewNotes").value=r.notes||"";save()}
function move(delta){account();index=Math.max(0,Math.min(items.length-1,index+delta));render()}document.querySelectorAll("[data-verdict]").forEach(b=>b.onclick=()=>{account();const r=review();r.verdict=b.dataset.verdict;r.updated_at=new Date().toISOString();save();render()});$("reviewNotes").oninput=()=>{review().notes=$("reviewNotes").value;review().updated_at=new Date().toISOString();save()};$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);function play(){for(const v of [$("sourceVideo"),$("targetVideo")]){v.currentTime=0;v.play()}}document.addEventListener("keydown",e=>{if(e.target.tagName==="TEXTAREA")return;if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1);if(e.code==="Space"){e.preventDefault();play()}});
function cell(v){const t=String(v??"");return /[",\n]/.test(t)?`"${t.replaceAll('"','""')}"`:t}$("export").onclick=()=>{account();save();const fields=["survey_version","sample_id","human_status","new72b_decision","capture_status","model_verdict","notes","seconds","updated_at"],rows=items.map(x=>{const r=state.reviews[x.sample_id]||{};return [survey.survey_version,x.sample_id,x.human_status,x.new72b_decision,x.capture_status,r.verdict||"",r.notes||"",r.seconds||0,r.updated_at||""]});const text=[fields,...rows].map(r=>r.map(cell).join(",")).join("\n")+"\n",a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));a.download=`${survey.survey_version}_review.csv`;a.click()};render();
</script></body></html>
