<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频编辑 Pair 审核</title>
  <style>
    :root { color-scheme:dark; --bg:#111318; --panel:#1b1f27; --muted:#9ca6b5; --line:#323946; --good:#2f9e63; --bad:#d64d55; --warn:#c9952e; --accent:#6ea8fe; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:#edf1f7; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:5; display:flex; gap:12px; align-items:center; padding:10px 16px; background:#141820f2; border-bottom:1px solid var(--line); }
    header strong { white-space:nowrap; }
    progress { width:220px; height:12px; }
    button,textarea { font:inherit; }
    button { color:#edf1f7; background:#282e39; border:1px solid #414a59; border-radius:7px; padding:7px 11px; cursor:pointer; }
    button:hover { background:#333b48; }
    button.active { outline:2px solid var(--accent); }
    button.good.active { outline-color:var(--good); background:#1d4b35; }
    button.bad.active { outline-color:var(--bad); background:#55262c; }
    button.warn.active { outline-color:var(--warn); background:#55421f; }
    button.primary { background:#285ea8; border-color:#4380d3; }
    main { max-width:1500px; margin:auto; padding:16px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
    .instruction { padding:12px 14px; background:#12151b; border-radius:7px; white-space:pre-wrap; font-size:17px; }
    .instruction .label { color:var(--muted); font-size:13px; margin-right:8px; }
    .video-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .video-card { min-width:0; }
    .video-label { color:var(--muted); margin-bottom:5px; font-weight:600; letter-spacing:.04em; }
    video { width:100%; max-height:64vh; background:#000; border-radius:8px; }
    .status-row { display:flex; gap:8px; margin:14px 0 8px; flex-wrap:wrap; align-items:center; }
    textarea { width:100%; min-height:72px; color:#edf1f7; background:#11151c; border:1px solid var(--line); border-radius:7px; padding:8px; }
    .footer-actions { display:flex; justify-content:space-between; gap:10px; margin:16px 0 40px; }
    .io { display:flex; gap:7px; flex-wrap:wrap; margin-left:auto; }
    .muted { color:var(--muted); }
    .timer { font-variant-numeric:tabular-nums; white-space:nowrap; }
    @media (max-width:900px) { .video-grid { grid-template-columns:1fr; } progress { width:120px; } header { flex-wrap:wrap; } .io { margin-left:0; } }
  </style>
</head>
<body>
<header>
  <strong>Pair 整体审核</strong>
  <progress id="progress" value="0" max="1"></progress>
  <span id="progressText"></span>
  <span class="timer" id="timer">00:00</span>
  <button id="jumpBtn">跳转</button>
  <div class="io">
    <button id="exportCsv">导出 CSV</button>
    <button id="exportJson">备份 JSON</button>
    <button id="importBtn">导入</button>
    <input id="importFile" type="file" accept=".csv,.json" hidden>
  </div>
</header>

<main>
  <section class="panel">
    <div class="instruction"><span class="label">INSTRUCTION</span><span id="instruction"></span></div>
  </section>

  <section class="panel">
    <div class="video-grid">
      <div class="video-card"><div class="video-label">SRC</div><video id="sourceVideo" controls muted loop playsinline></video></div>
      <div class="video-card"><div class="video-label">TARGET</div><video id="targetVideo" controls muted loop playsinline></video></div>
    </div>

    <div class="status-row">
      <strong>整体结论</strong>
      <button class="status good" data-status="usable">1 可用</button>
      <button class="status bad" data-status="unusable">0 不可用</button>
      <button class="status warn" data-status="uncertain">2 仍存疑</button>
      <span class="muted">一次判断 source、target 与 instruction；空格同步播放</span>
    </div>
    <textarea id="notes" placeholder="可选备注"></textarea>
  </section>

  <div class="footer-actions">
    <button id="previous">← 上一条</button>
    <span id="saveState" class="muted">已自动保存</span>
    <button id="next" class="primary">完成本条并继续 →</button>
  </div>
</main>

<script id="surveyData" type="application/json">__SURVEY_DATA__</script>
<script>
(() => {
  "use strict";
  const survey = JSON.parse(document.getElementById("surveyData").textContent);
  const items = survey.items;
  const storageKey = `compact-pair-review:${survey.survey_version}`;
  const $ = id => document.getElementById(id);
  const sourceVideo = $("sourceVideo"), targetVideo = $("targetVideo");
  let state = loadState();
  let index = Math.min(Number(state.index || 0), Math.max(0, items.length - 1));
  let enteredAt = Date.now();
  let syncLock = false;

  function emptyReview() { return {status:"",notes:"",seconds:0,updated_at:""}; }
  function freshState() { return {version:survey.survey_version,index:0,reviews:{}}; }
  function loadState() {
    try {
      const parsed = JSON.parse(localStorage.getItem(storageKey) || "null");
      return parsed && parsed.version === survey.survey_version ? parsed : freshState();
    } catch (_) { return freshState(); }
  }
  function currentReview() {
    const id = items[index].sample_id;
    if (!state.reviews[id]) state.reviews[id] = emptyReview();
    return state.reviews[id];
  }
  function save() {
    state.index = index;
    localStorage.setItem(storageKey, JSON.stringify(state));
    $("saveState").textContent = "已自动保存 " + new Date().toLocaleTimeString();
    updateProgress();
  }
  function accountTime() {
    const review = currentReview();
    review.seconds = Number(review.seconds || 0) + Math.max(0, Math.round((Date.now() - enteredAt) / 1000));
    enteredAt = Date.now();
  }
  function collect() {
    const review = currentReview();
    review.notes = $("notes").value;
    review.updated_at = new Date().toISOString();
  }
  function render() {
    const item = items[index], review = currentReview();
    enteredAt = Date.now();
    $("instruction").textContent = item.instruction;
    sourceVideo.src = item.source_media;
    targetVideo.src = item.target_media;
    document.querySelectorAll(".status").forEach(button => button.classList.toggle("active", button.dataset.status === review.status));
    $("notes").value = review.notes || "";
    $("next").textContent = index === items.length - 1 ? "保存最后一条" : "完成本条并继续 →";
    updateProgress();
  }
  function setStatus(status) {
    accountTime();
    currentReview().status = status;
    collect();
    save();
    render();
  }
  function move(delta) {
    collect();
    accountTime();
    if (delta > 0 && !currentReview().status) {
      alert("请先选择整体结论：可用、不可用或仍存疑。");
      return;
    }
    index = Math.max(0, Math.min(items.length - 1, index + delta));
    save();
    render();
  }
  function updateProgress() {
    const completed = items.filter(item => state.reviews[item.sample_id]?.status).length;
    $("progress").max = items.length;
    $("progress").value = completed;
    $("progressText").textContent = `${completed}/${items.length} 完成 · 当前 ${index + 1}/${items.length}`;
    const seconds = Object.values(state.reviews).reduce((sum, review) => sum + Number(review.seconds || 0), 0);
    $("timer").textContent = new Date(seconds * 1000).toISOString().slice(11, 19);
  }
  function download(name, text, type) {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([text], {type}));
    link.download = name;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }
  function csvCell(value) {
    const text = String(value ?? "");
    return /[",\n]/.test(text) ? `"${text.replaceAll('"','""')}"` : text;
  }
  const exportFields = ["survey_version","sample_id","dataset","branch","instruction","overall_status","notes","seconds","updated_at"];
  function reviewRows() {
    return items.map(item => {
      const review = state.reviews[item.sample_id] || emptyReview();
      return {survey_version:survey.survey_version,sample_id:item.sample_id,dataset:item.dataset,branch:item.branch,instruction:item.instruction,overall_status:review.status,notes:review.notes,seconds:review.seconds,updated_at:review.updated_at};
    });
  }
  function exportCsv() {
    const rows = reviewRows();
    const text = [exportFields.join(","), ...rows.map(row => exportFields.map(field => csvCell(row[field])).join(","))].join("\n") + "\n";
    download(`${survey.survey_version}_review.csv`, text, "text/csv;charset=utf-8");
  }
  function parseCsv(text) {
    const rows=[]; let row=[],cell="",quoted=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(quoted){ if(c==='"'&&text[i+1]==='"'){cell+='"';i++;} else if(c==='"')quoted=false; else cell+=c; }
      else if(c==='"')quoted=true; else if(c===','){row.push(cell);cell="";} else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell="";} else if(c!=='\r')cell+=c;
    }
    if(cell||row.length){row.push(cell);rows.push(row);}
    const headers=rows.shift()||[];
    return rows.filter(row=>row.length).map(row=>Object.fromEntries(headers.map((header,i)=>[header,row[i]||""])));
  }
  function importCsv(rows) {
    const known = new Set(items.map(item => item.sample_id));
    let count = 0;
    for (const row of rows) {
      if (!known.has(row.sample_id) || !row.overall_status) continue;
      state.reviews[row.sample_id] = {status:row.overall_status,notes:row.notes||"",seconds:Number(row.seconds||0),updated_at:row.updated_at||""};
      count++;
    }
    state.version = survey.survey_version;
    save(); render(); return count;
  }
  function importJson(parsed) {
    if (!parsed || typeof parsed !== "object" || !parsed.reviews) throw new Error("JSON 不是有效的 compact pair 审核备份");
    const known = new Set(items.map(item => item.sample_id));
    let count = 0;
    for (const [sampleId, review] of Object.entries(parsed.reviews)) {
      if (!known.has(sampleId) || !review || !review.status) continue;
      state.reviews[sampleId] = JSON.parse(JSON.stringify(review)); count++;
    }
    state.version = survey.survey_version;
    save(); render(); return count;
  }
  function sync(primary, secondary, action) {
    if (syncLock) return;
    syncLock = true;
    if (action === "play") secondary.play().catch(()=>{});
    if (action === "pause") secondary.pause();
    if (action === "seek" && Math.abs(primary.currentTime - secondary.currentTime) > .08) secondary.currentTime = primary.currentTime;
    setTimeout(() => syncLock = false, 0);
  }

  document.querySelectorAll(".status").forEach(button => button.addEventListener("click", () => setStatus(button.dataset.status)));
  $("notes").addEventListener("input", () => { collect(); save(); });
  $("next").addEventListener("click", () => move(1));
  $("previous").addEventListener("click", () => move(-1));
  $("jumpBtn").addEventListener("click", () => {
    const raw = prompt(`跳转到 1-${items.length}`, String(index + 1)), nextIndex = Number(raw);
    if (Number.isInteger(nextIndex) && nextIndex >= 1 && nextIndex <= items.length) { collect(); accountTime(); index=nextIndex-1; save(); render(); }
  });
  $("exportCsv").addEventListener("click", exportCsv);
  $("exportJson").addEventListener("click", () => download(`${survey.survey_version}_backup.json`, JSON.stringify(state,null,2), "application/json"));
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async event => {
    const file=event.target.files[0]; if(!file)return;
    try { const text=await file.text(); const count=file.name.toLowerCase().endsWith(".json")?importJson(JSON.parse(text)):importCsv(parseCsv(text)); alert(`已按 sample_id 导入 ${count} 条审核。`); }
    catch(error) { alert("导入失败：" + (error?.message || error)); }
    finally { event.target.value=""; }
  });
  [sourceVideo,targetVideo].forEach(video => {
    const other=video===sourceVideo?targetVideo:sourceVideo;
    video.addEventListener("play",()=>sync(video,other,"play"));
    video.addEventListener("pause",()=>sync(video,other,"pause"));
    video.addEventListener("seeking",()=>sync(video,other,"seek"));
  });
  document.addEventListener("keydown", event => {
    if (event.target.matches("textarea,input")) return;
    if(event.key==="1")setStatus("usable");
    else if(event.key==="0")setStatus("unusable");
    else if(event.key==="2")setStatus("uncertain");
    else if(event.key===" "){event.preventDefault(); if(sourceVideo.paused&&targetVideo.paused){sourceVideo.play().catch(()=>{});}else{sourceVideo.pause();targetVideo.pause();}}
    else if(event.key==="ArrowRight")move(1);
    else if(event.key==="ArrowLeft")move(-1);
  });
  setInterval(updateProgress,1000);
  window.addEventListener("beforeunload",()=>{collect();accountTime();save();});
  render();
})();
</script>
</body>
</html>
