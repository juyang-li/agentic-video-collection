<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>换衣与动作替换 · 数据审核</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#edf0f5;font:15px system-ui,sans-serif}header{position:sticky;top:0;background:#12161d;padding:12px 20px;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #303845}button,.file,select{background:#222c3b;color:#edf0f5;border:1px solid #46546b;border-radius:6px;padding:8px 11px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.file input{display:none}main{max-width:1500px;margin:auto;padding:16px}h1{font-size:22px;margin:8px 0}h2{font-size:16px;margin:0 0 8px}.muted{color:#a9b4c6;font-size:13px}.notice{padding:10px 13px;background:#1b2331;border-left:3px solid #88a8e5;margin:10px 0;white-space:pre-line}.media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.media.motion{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{background:#000;border:1px solid #303845;border-radius:7px;padding:10px;min-width:0}.panel video,.panel img{display:block;width:100%;height:470px;object-fit:contain;background:#000}.panel p{margin:6px 0}.instruction{padding:14px;background:#151d29;border-radius:6px;line-height:1.6}.actions{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}.audit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.field{background:#151a22;padding:10px;border:1px solid #2c3443;border-radius:6px}.field label{display:block;margin-bottom:6px}.field select{width:100%}.na{opacity:.5}.notes{grid-column:1/-1}textarea{width:100%;background:#090d14;color:#edf0f5;border:1px solid #46546b;border-radius:5px;padding:9px;font:inherit}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.source{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#b7c2d3;margin:8px 0}#status{color:#bcd4b1}a{color:#a9c7ff}@media(max-width:800px){.media,.media.motion,.audit{grid-template-columns:1fr}.panel video,.panel img{height:420px}}
</style><style>__FONT_FACE__ body,button,select,option,input,textarea{font-family:ReviewCJK,system-ui,sans-serif}</style></head><body>
<header><strong>换衣 25 ＋ 动作替换 25</strong><span class="muted" id="progress"></span><select id="filter"><option value="all">全部 50 条</option><option value="garment">换衣 25 条</option><option value="motion">动作替换 25 条</option></select><button id="exportJson">导出 JSON</button><button id="exportCsv">导出 CSV</button><label class="file">导入 JSON<input id="importJson" type="file" accept=".json"></label><label class="file">导入 CSV<input id="importCsv" type="file" accept=".csv"></label></header>
<main><p class="muted">离线数据审核包 · 尚未运行编辑模型。1＝通过，0＝不通过，2＝存疑；默认 1 仅为填写起点，不代表已经人工审核。</p><h1 id="heading"></h1><p class="muted" id="meta"></p><div id="notice" class="notice"></div><div class="media" id="media"></div><div class="actions"><button id="playAll">同步从头播放</button><button id="pauseAll">全部暂停</button><span class="muted">原速播放、不补帧、不循环。时长不同时各片段独立结束；可用播放器控件单独查看或全屏。</span></div><div class="instruction"><div id="instructionZh"></div><div class="muted" id="instructionEn"></div></div><details><summary>查看来源、配对方式与技术规格</summary><div class="source" id="source"></div></details><div class="audit" id="form"></div><div class="actions"><label><input type="checkbox" id="reviewed"> 本条已人工审核</label><span id="status"></span></div><div class="footer"><button id="prev">← 上一条</button><span id="position"></span><button id="next">下一条 →</button></div></main>
<script>
const DATA=__REVIEW_DATA__,KEY=DATA.version+':audit';
const LABELS={person_relevance:'人物编辑相关',instruction_correctness:'GT 是否完成换衣指令',logical_correctness:'动作／编辑逻辑',content_preservation:'GT 非编辑内容保持',temporal_consistency:'视频时间一致性',visual_quality:'素材画面质量',technical_quality:'文件播放与技术质量',reference_quality:'参考是否清楚、有效',instruction_feasibility:'在 source 中是否可执行'};
const FIELDS=Object.keys(LABELS),DEFAULTS=Object.fromEntries(DATA.cards.map(c=>[c.id,{id:c.id,hash:c.hash,task:c.task,...Object.fromEntries(FIELDS.map(f=>[f,'1'])),reviewed:false,notes:''}]));
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}state={...structuredClone(DEFAULTS),...(state||{})};let visible=DATA.cards,index=0;
const $=id=>document.getElementById(id);function esc(s){const el=document.createElement('div');el.textContent=String(s??'');return el.innerHTML}function videos(){return [...$('media').querySelectorAll('video')]}function pause(){videos().forEach(v=>v.pause())}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){$('status').textContent='本地保存失败，请导出审核文件'}$('progress').textContent=`已审核 ${Object.values(state).filter(r=>r.reviewed).length} / 50`}
function render(){pause();const c=visible[index],r=state[c.id];$('heading').textContent=c.id+' · '+c.title;$('meta').textContent=c.kind==='garment'?'换衣：SOURCE + GARMENT → TARGET（已有数据集配对）':'动作替换：SOURCE + DRIVING VIDEO（待编辑输入对，无结果 GT）';$('notice').textContent=c.notice;$('media').className='media '+(c.kind==='motion'?'motion':'');$('media').innerHTML=c.panels.map(p=>`<section class="panel"><h2>${esc(p.label)}</h2>${p.type==='image'?`<img src="${esc(p.path)}" alt="服装参考图">`:`<video controls playsinline preload="metadata" muted src="${esc(p.path)}"></video>`}<p class="muted">${esc(p.description)}</p></section>`).join('');$('instructionZh').textContent=c.instruction_zh;$('instructionEn').textContent=c.instruction_en;$('source').textContent=JSON.stringify(c.provenance,null,2);$('form').innerHTML=FIELDS.map(f=>`<div class="field ${c.not_applicable.includes(f)?'na':''}"><label>${LABELS[f]}${c.not_applicable.includes(f)?'（无 GT，不适用）':''}</label><select data-field="${f}" ${c.not_applicable.includes(f)?'disabled':''}><option value="1">1 · 通过</option><option value="0">0 · 不通过</option><option value="2">2 · 存疑</option></select></div>`).join('')+'<div class="field notes"><label>备注</label><textarea data-field="notes" rows="3" placeholder="记录素材问题、配对不合理或希望更换的参考"></textarea></div>';$('form').querySelectorAll('[data-field]').forEach(el=>{el.value=r[el.dataset.field]??'';el.onchange=()=>{state[c.id][el.dataset.field]=el.value;save()}});$('reviewed').checked=!!r.reviewed;$('reviewed').onchange=()=>{r.reviewed=$('reviewed').checked;save()};$('position').textContent=`${index+1} / ${visible.length}`;$('prev').disabled=index===0;$('next').disabled=index===visible.length-1;save()}
$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index+1<visible.length){index++;render()}};$('filter').onchange=()=>{visible=DATA.cards.filter(c=>$('filter').value==='all'||c.kind===$('filter').value);index=0;render()};$('pauseAll').onclick=pause;$('playAll').onclick=async()=>{pause();videos().forEach(v=>v.currentTime=0);try{await Promise.all(videos().map(v=>v.play()))}catch(e){$('status').textContent='部分视频未能播放，请单独查看'}};
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('exportJson').onclick=()=>download(DATA.version+'_audit.json',JSON.stringify({version:DATA.version,reviews:DATA.cards.map(c=>state[c.id])},null,2),'application/json');
const HEADERS=['id','hash','task',...FIELDS,'reviewed','notes'];function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"'}$('exportCsv').onclick=()=>download(DATA.version+'_audit.csv','\ufeff'+[HEADERS,...DATA.cards.map(c=>HEADERS.map(k=>state[c.id][k]))].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
function applyRows(rows){let n=0;for(const row of rows){if(!DEFAULTS[row.id])continue;const next={...state[row.id]};for(const f of FIELDS)if(['0','1','2'].includes(String(row[f])))next[f]=String(row[f]);if('notes' in row)next.notes=String(row.notes);if('reviewed' in row)next.reviewed=row.reviewed===true||row.reviewed==='true'||row.reviewed==='1';state[row.id]=next;n++}save();render();$('status').textContent=`已导入 ${n} 条审核记录`}
function parseCsv(text){text=text.replace(/^\ufeff/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=ch}if(quoted)throw new Error('CSV 引号未闭合');if(cell||row.length){row.push(cell);rows.push(row)}const header=rows.shift();return rows.map(r=>Object.fromEntries(header.map((h,i)=>[h,r[i]??''])))}
$('importJson').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.version!==DATA.version)throw new Error('审核包版本不匹配');applyRows(d.reviews)}catch(err){$('status').textContent='导入失败：'+err.message}e.target.value=''};$('importCsv').onchange=async e=>{try{applyRows(parseCsv(await e.target.files[0].text()))}catch(err){$('status').textContent='导入失败：'+err.message}e.target.value=''};
const renderCard=render;render=function(){renderCard();window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});render();
</script></body></html>
