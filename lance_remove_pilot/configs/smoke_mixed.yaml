D1:
  x2v_interleave_local:
    dataset_type: video2video
    raw_bytes_input: true
    is_image: false
    target_modality: video
    task_type: tv2v
    sample_task: edit
    vision_cond_type: [vit, vae_Nsplit]
    text_template: true
    dataset_names:
      insave_smoke:
        data_dir:
          - ../../exports/insave_smoke.parquet
    debug_parquet_repeat: 1

    video_transform_args:
      resolution: 640
      mode: bucket
      divisible_crop_size: 16
      stride_spatial: 16
      stride_temporal: 4
      aspect_ratios: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
      mean: 0.5
      std: 0.5

    vit_video_transform_args:
      resolution: 616
      mode: bucket
      divisible_crop_size: 28
      aspect_ratios: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
      mean: [0.48145466, 0.4578275, 0.40821073]
      std: [0.26862954, 0.26130258, 0.27577711]

    video_frame_sampler_args:
      type: multi_clips
      res_dump: [image_480p, 12fps_480p]
      params:
        temporal: 4
        sample_fps: 12
        # Keep two mandatory v2v samples inside the 65k-token smoke pack.
        max_duration: 1
        assert_seconds: false
        truncate: false

    # Smoke-only gate: force every packed batch to contain this source.
    is_mandatory: true
    weight: 1.0

